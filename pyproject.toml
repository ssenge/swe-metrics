# swe-metrics: a stateless measuring tool for software (docs/implementation-plan.md).
# Gate thresholds only tighten; scripts/gate.sh runs them.

[project]
name = "swe-metrics"
version = "0.0.1"
description = "Stateless software metrics: code, IaC, docs and architecture models in, a metric report out"
requires-python = ">=3.12"
dependencies = ["lizard==1.24.1", "complexipy==8.0.1", "defusedxml==0.7.1"]

[project.optional-dependencies]
dev = ["ruff", "mypy", "complexipy", "interrogate", "pytest", "pytest-cov", "bandit", "pip-audit",
       "import-linter", "jsonschema", "types-jsonschema", "types-defusedxml"]   # plus gitleaks and Node (jscpd) on the PATH

[project.scripts]
swe-metrics = "swe_metrics.cli.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["swe_metrics*"]

[tool.setuptools.package-data]
swe_metrics = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.importlinter]
root_package = "swe_metrics"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "core is pure: no other layer, no tool libraries"
type = "forbidden"
source_modules = ["swe_metrics.core"]
forbidden_modules = ["swe_metrics.analyzers", "swe_metrics.runner", "swe_metrics.cli", "swe_metrics.scoring",
                     "lizard", "subprocess"]

[[tool.importlinter.contracts]]
name = "analyzers depend only on core"
type = "forbidden"
source_modules = ["swe_metrics.analyzers"]
forbidden_modules = ["swe_metrics.runner", "swe_metrics.cli"]

[[tool.importlinter.contracts]]
name = "analyzers never import each other"
type = "independence"
modules = ["swe_metrics.analyzers.*"]

[[tool.importlinter.contracts]]
name = "scoring is pure and depends on nothing but the report format"
type = "forbidden"
source_modules = ["swe_metrics.scoring"]
forbidden_modules = ["swe_metrics.analyzers", "swe_metrics.runner", "swe_metrics.cli", "swe_metrics.tools",
                     "subprocess"]

[[tool.importlinter.contracts]]
name = "tools depend only on core"
type = "forbidden"
source_modules = ["swe_metrics.tools"]
forbidden_modules = ["swe_metrics.analyzers", "swe_metrics.runner", "swe_metrics.cli"]

[[tool.importlinter.contracts]]
name = "runner depends only on core (analyzers are injected)"
type = "forbidden"
source_modules = ["swe_metrics.runner"]
forbidden_modules = ["swe_metrics.analyzers", "swe_metrics.cli"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C90", "N", "PL"]
ignore = ["PLR2004"]            # magic-value comparisons: noisy in tests and lookup code

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 5

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = ["lizard", "lizard_ext.*", "complexipy"]   # no type stubs published
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]                  # tests are typed loosely; production code is strict
disallow_untyped_defs = false
disallow_untyped_calls = false
disallow_incomplete_defs = false

[tool.complexipy]
max-complexity-allowed = 15

[tool.interrogate]
fail-under = 90

[tool.coverage.run]
branch = true

[tool.coverage.report]
fail_under = 85
